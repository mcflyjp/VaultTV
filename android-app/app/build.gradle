plugins {
    id 'com.android.application'
}

android {
    namespace         'app.vaulttv'
    compileSdk        34

    defaultConfig {
        applicationId   'app.vaulttv'
        minSdk          22          // Fire OS 5+ / Android 5.1+
        targetSdk       34
        versionCode     32
        versionName     '0.31.0'

        // Which build of the web app this APK loads. Overridden per build type
        // below so a beta build can point at a preview deployment without the
        // URL being edited by hand before every test.
        buildConfigField 'String', 'VAULTTV_URL', '"https://vaulttv.pages.dev"'
        resValue 'string', 'app_name', 'VaultTV'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled   false
            signingConfig   signingConfigs.debug  // swap for keystore in production
        }

        // Installs alongside the real app rather than replacing it.
        //
        // The household watches on the same televisions this gets tested on, so
        // a beta that overwrote the working app would take the living room down
        // every time something half finished was tried. A separate application
        // id means both sit in the launcher and the real one is never touched.
        beta {
            initWith debug
            applicationIdSuffix '.beta'
            versionNameSuffix   '-beta'
            buildConfigField 'String', 'VAULTTV_URL', '"https://v2-watch-providers.vaulttv.pages.dev"'
            resValue 'string', 'app_name', 'VaultTV Beta'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Media3 ExoPlayer — native video playback (HEVC, AC3, DTS, HLS, DASH) — FireTV only
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'

    // libVLC — universal codec support for non-FireTV Android devices
    implementation 'org.videolan.android:libvlc-all:3.6.0'

    // Local ROM library: DocumentFile wraps SAF tree URIs for recursive folder
    // traversal (raw ContentResolver/DocumentsContract queries work too, but
    // DocumentFile is the standard, much less error-prone API for this)
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Google Cast — phones/tablets only. The web layer's Cast support
    // (CastContext.jsx / Remote Playback API) is inert here: Android WebView
    // ships without Chrome's media-router integration, so neither
    // window.chrome.cast nor video.remote exists. Casting from this app has to
    // go through the native SDK and out over the JS bridge.
    //
    // Pinned to 21.3.0 deliberately: it still supports minSdk 21, whereas
    // 22.x raises the floor to 23 and would drop Fire OS 5 (minSdk 22) here.
    // Cast isn't used on FireTV anyway — Play services aren't present there —
    // so paying for it with TV compatibility would be a bad trade.
    implementation 'com.google.android.gms:play-services-cast-framework:21.3.0'
    implementation 'androidx.mediarouter:mediarouter:1.6.0'
}
